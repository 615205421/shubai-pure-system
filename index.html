<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
<title>述白·voidvow 极简洗衣管家</title>
<style>
/* ==================== 全局基础样式 ==================== */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#fff;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#111;width:100%}
.app-full{width:100%;max-width:100%;margin:0 auto;background:#fff}
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:20px 40px;border-bottom:1px solid #f0f0f0;flex-wrap:wrap}
.logo h1{font-size:2rem;font-weight:600;letter-spacing:-0.5px;color:#000}
.logo h1 span{font-weight:300;color:#6c6c70}
.logo p{font-size:.85rem;color:#6c6c70;margin-top:4px}
.shop-info{display:flex;gap:30px;font-size:.85rem;color:#3a3a3c}
.view{width:100%}
.hidden-view{display:none}
.back-btn{background:0 0;border:1px solid #ddd;padding:10px 24px;border-radius:40px;font-size:.85rem;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.phone-orders-container{max-width:1200px;margin:0 auto;padding:40px}
.login-section{text-align:center;padding:40px 24px 30px}
.login-icon{font-size:4rem;margin-bottom:20px}
.login-title{font-size:2rem;font-weight:600;margin-bottom:8px;color:#000}
.login-desc{color:#6c6c70;font-size:1rem;margin-bottom:32px}
.phone-input-wrapper{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;max-width:600px;margin:0 auto}
.phone-input-wrapper input{flex:3;min-width:260px;padding:16px 24px;font-size:1.1rem;border:1px solid #e5e5ea;border-radius:60px;background:#fff;font-family:monospace;outline:0}
.phone-input-wrapper input:focus{border-color:#000}
.enter-btn{background:#000;color:#fff;border:none;padding:16px 48px;border-radius:60px;font-weight:600;font-size:1.1rem;cursor:pointer;min-width:160px}
.new-user-btn{background:#2c2c2e;color:#fff;border:none;padding:16px 24px;border-radius:60px;font-weight:600;font-size:1rem;cursor:pointer;min-width:140px}
.error-hint{color:#ff3b30;font-size:.85rem;margin-top:16px}

/* ==================== 订单列表模块 ==================== */
.orders-section-header{display:flex;justify-content:space-between;align-items:center;padding:24px 0 12px;flex-wrap:wrap;gap:16px}
.orders-section-header h3{font-size:1.3rem;font-weight:600}
.search-area{margin-bottom:16px}
.search-box{width:100%;margin-bottom:12px}
.search-box input{width:100%;padding:14px 20px;font-size:1rem;border:1px solid #e5e5ea;border-radius:48px;background:#fff;outline:0}
.search-box input:focus{border-color:#000}
.filter-options{display:flex;gap:24px;margin-bottom:8px;flex-wrap:wrap}
.filter-options label{display:flex;align-items:center;gap:8px;font-size:.9rem;color:#333;cursor:pointer}
.filter-options input[type="checkbox"]{width:18px;height:18px;cursor:pointer}
.orders-list-area{max-height:500px;overflow-y:auto;padding:4px 0}
.order-card-mini{background:#fff;border-bottom:1px solid #f0f0f0;padding:20px 0;transition:.1s}
.order-card-mini:last-child{border-bottom:none}
.order-header-mini{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;margin-bottom:10px;gap:10px}
.order-id-mini{font-weight:700;font-family:monospace;font-size:.8rem;background:#f5f5f7;padding:4px 14px;border-radius:30px}
.order-date-mini{font-size:.75rem;color:#8e8e93}
.order-total-mini{font-weight:700;font-size:1.1rem}
.order-items-mini{font-size:.85rem;color:#555;margin-top:8px}
.order-customer-mini{font-size:.8rem;color:#6c6c70;margin-top:8px;display:inline-block;background:#f5f5f7;padding:4px 14px;border-radius:30px}
.order-actions-mini{margin-top:12px;display:flex;gap:12px;flex-wrap:wrap}
.detail-order-btn,.edit-order-btn,.print-order-btn{background:#f5f5f7;border:none;padding:8px 20px;border-radius:30px;font-size:.75rem;cursor:pointer;color:#333}
.edit-order-btn{background:#e8e8ed;color:#000}
.print-order-btn{background:#e0e0e0;color:#000}
.empty-orders-mini{text-align:center;padding:60px 20px;color:#aaa;font-size:.95rem}

/* ==================== 洗衣下单模块 ==================== */
.user-welcome{display:flex;justify-content:space-between;align-items:center;padding:16px 40px;background:#fafafc;border-bottom:1px solid #efefef;flex-wrap:wrap;gap:16px}
.user-info{font-size:1rem;font-weight:500}
.balance-info{font-size:.85rem;color:#2c2c2e;background:#e8e8ed;padding:4px 12px;border-radius:30px}
.categories-scroll{overflow-x:auto;white-space:nowrap;padding:20px 40px;display:flex;gap:16px;border-bottom:1px solid #f0f0f0}
.cat-chip{display:inline-block;padding:10px 28px;background:#f5f5f7;border-radius:50px;font-size:.95rem;font-weight:500;cursor:pointer}
.cat-chip.active{background:#000;color:#fff}
.garments-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:20px;padding:32px 40px}
.garment-card{background:#fff;border:1px solid #efeff4;border-radius:28px;padding:20px 12px;text-align:center;cursor:pointer;transition:.1s}
.garment-card:active{transform:scale(.97);background:#fafafc}
.garment-name{font-weight:600;font-size:1rem;margin-bottom:8px}
.garment-price{font-size:1rem;font-weight:700;color:#000}
.history-section{padding:12px 40px 28px;border-top:1px solid #f2f2f5}
.history-title{font-size:.85rem;font-weight:500;color:#8e8e93;margin-bottom:16px}
.history-list{display:flex;flex-wrap:wrap;gap:12px}
.history-item{background:#f5f5f7;padding:10px 22px;border-radius:50px;font-size:.9rem;cursor:pointer}

/* ==================== 购物车底部栏 ==================== */
.cart-bottom-bar{background:#fff;border-top:1px solid #efefef;padding:20px 40px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:20px;position:sticky;bottom:0}
.cart-stats{display:flex;gap:32px;align-items:baseline;flex-wrap:wrap}
.cart-price-info{display:flex;flex-direction:column;gap:4px}
.original-price{font-size:.85rem;color:#666}
.discounted-price{font-size:1.5rem;font-weight:800;color:#000}
.discount-section{display:flex;align-items:center;gap:12px;background:#f5f5f7;padding:8px 18px;border-radius:50px}
.discount-section label{font-size:.8rem;color:#666}
.discount-input{width:80px;padding:8px 8px;border:1px solid #ddd;border-radius:30px;text-align:center;font-size:.9rem;background:#fff}
.discount-slider{width:140px;cursor:pointer}
.discount-unit{font-size:.75rem;color:#666}
.checkout-button,.home-button{background:#000;color:#fff;border:none;padding:14px 36px;border-radius:50px;font-weight:600;font-size:1rem;cursor:pointer}
.home-button{background:#2c2c2e;margin-right:12px}
.order-detail-list{padding:16px 40px 12px;font-size:.85rem;background:#fefefe;border-top:.5px solid #f0f0f0}
.order-item-row{display:flex;justify-content:space-between;margin-bottom:10px}
.remove-item-btn{background:0 0;border:none;color:#888;font-size:.8rem;margin-left:12px;cursor:pointer}

/* ==================== 结算模块 (优化版) ==================== */
.checkout-container{max-width:600px;margin:0 auto;padding:24px}
.checkout-header{display:flex;align-items:center;gap:20px;margin-bottom:24px;padding-bottom:12px;border-bottom:1px solid #efefef}
.checkout-title{font-size:1.3rem;font-weight:600}
.order-summary-card{background:#fafafc;border-radius:24px;padding:20px;margin-bottom:24px}
.summary-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #efefef;font-size:.9rem}
.summary-row:last-child{border-bottom:none}
.total-amount{font-size:1.3rem;font-weight:800}
.payment-methods{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}
.payment-method{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 12px;border-radius:20px;border:1.5px solid #e5e5ea;background:#fff;cursor:pointer;transition:all .2s;font-size:.85rem;color:#666}
.payment-method.selected{background:#000;border-color:#000;color:#fff}
.payment-method:hover{background:#f5f5f7}
.confirm-order-btn{background:#000;color:#fff;width:100%;padding:16px;border-radius:60px;font-weight:600;font-size:1rem;border:none;margin-top:16px;cursor:pointer}

/* ==================== 弹窗模块 ==================== */
.detail-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000}
.detail-modal{background:#fff;border-radius:32px;max-width:500px;width:90%;max-height:80vh;overflow-y:auto;padding:28px}
.detail-modal h3{font-size:1.3rem;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid #efefef}
.detail-item-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #f0f0f0}
.detail-item-row:last-child{border-bottom:none}
.close-detail-btn{background:#000;color:#fff;border:none;padding:12px 24px;border-radius:40px;font-size:.9rem;cursor:pointer;margin-top:20px;width:100%}
.recharge-options{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0;justify-content:center}
.recharge-amount{background:#f5f5f7;border:2px solid #e5e5ea;border-radius:40px;padding:12px 20px;cursor:pointer;font-weight:600;font-size:1rem;transition:all 0.2s}
.recharge-amount.selected{background:#000;border-color:#000;color:#fff}
.recharge-amount:hover{background:#e0e0e0}
.modal-input{width:100%;padding:14px 20px;font-size:1rem;border:1px solid #e5e5ea;border-radius:48px;margin-bottom:16px;outline:0}
.modal-input:focus{border-color:#000}
@media (max-width:768px){
.garments-grid{grid-template-columns:repeat(2,1fr);padding:20px;gap:14px}
.categories-scroll,.user-welcome,.cart-bottom-bar{padding:12px 20px}
.top-bar{padding:12px 20px}
.phone-orders-container{padding:20px}
.login-title{font-size:1.5rem}
.enter-btn,.new-user-btn{padding:14px 20px;font-size:.9rem}
.cart-total{font-size:1.4rem}
.phone-input-wrapper input{padding:14px 20px}
.discount-section{padding:4px 12px}
.discount-input{width:65px}
.discount-slider{width:100px}
.filter-options{gap:16px}
.filter-options label{font-size:.8rem}
.payment-methods{gap:8px}
.payment-method{min-width:80px;padding:8px 12px;font-size:.8rem}
.recharge-amount{padding:8px 16px;font-size:.85rem}
.checkout-container{padding:16px}
.payment-methods{grid-template-columns:repeat(3,1fr);gap:8px}
.payment-method{padding:10px 8px;font-size:.75rem}
}
button,.garment-card,.cat-chip,.history-item{cursor:pointer}
.action-buttons{display:flex;gap:12px;align-items:center}

/* ==================== 电脑端适配 ==================== */
@media (min-width:1024px){.app-full{max-width:1200px;margin:0 auto;box-shadow:0 0 20px rgba(0,0,0,0.05)}.garments-grid{grid-template-columns:repeat(6,1fr);gap:16px}.categories-scroll{justify-content:center;gap:12px}.cart-bottom-bar .cart-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}.cart-stats{flex-direction:row;align-items:center;gap:32px}.cart-price-info{flex-direction:row;align-items:baseline;gap:20px}.discount-section{flex-direction:row;align-items:center}.checkout-container{max-width:600px;margin:0 auto}.payment-methods{grid-template-columns:repeat(5,1fr)}.order-card-mini{max-width:800px;margin:0 auto 12px auto}.search-box input{max-width:400px}.filter-options{justify-content:flex-start}}
</style>
</head>
<body>
<div class="app-full">
<!-- ⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡ -->
<!--   ✦ 顶部栏模块 ✦       -->
<!-- ⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡ -->
<div class="top-bar"><div class="logo"><h1>述白 <span>voidvow</span></h1><p>极简洗衣 · 净澈如初</p></div><div class="shop-info"><span>🏠 述白·滨江店</span><span>📞 15946898160</span></div></div>

<!-- ⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡ -->
<!--   ✦ 密码锁屏模块 ✦       -->
<!-- ⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡ -->
<div id="passwordView" class="view"><div class="phone-orders-container" style="max-width:600px;padding-top:20px"><div class="login-section"><div class="login-icon">🔐</div><div class="login-title">系统登入</div><div class="login-desc">请输入管理密码</div><div class="phone-input-wrapper" style="flex-direction:column;gap:20px"><input type="password" id="systemPasswordInput" placeholder="管理密码" autocomplete="off" style="text-align:center;width:100%"><button class="enter-btn" id="unlockSystemBtn" style="width:100%">解锁系统 →</button></div><div id="passwordError" class="error-hint"></div><div style="margin-top:32px;font-size:.75rem;color:#bbb;cursor:pointer;text-align:center" id="changePwdHint">🔑 双击修改密码</div></div></div></div>

<!-- ⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡ -->
<!--   ✦ 订单总览模块 ✦       -->
<!-- ⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡ -->
<div id="mainView" class="view hidden-view"><div class="phone-orders-container"><div class="login-section"><div class="login-icon">🌿✨</div><div class="login-title">开始收衣</div><div class="login-desc">输入手机号进入</div><div class="phone-input-wrapper"><input type="tel" id="phoneInput" placeholder="手机号码" maxlength="11" autocomplete="off"><button class="enter-btn" id="startLaundryBtn">进入 →</button><button class="new-user-btn" id="newUserBtn">➕ 新用户/充值</button></div><div id="loginError" class="error-hint"></div></div><div class="orders-section-header"><h3>📋 全部收衣订单</h3></div><div class="search-area"><div class="search-box"><input type="text" id="searchInput" placeholder="🔍 输入关键词搜索..." autocomplete="off"></div><div class="filter-options"><label><input type="checkbox" id="filterPhone" value="phone"> 📞 手机号</label><label><input type="checkbox" id="filterOrderId" value="orderId"> 🧾 订单号</label><label><input type="checkbox" id="filterName" value="name"> 👤 客户姓名</label></div></div><div class="orders-list-area" id="ordersListArea"></div></div></div>

<!-- ⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡ -->
<!--   ✦ 洗衣下单模块 ✦       -->
<!-- ⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡ -->
<div id="laundryView" class="view hidden-view"><div class="laundry-main"><div class="user-welcome"><div class="user-info" id="userWelcomeSpan">👤 顾客: --</div><div class="balance-info" id="balanceDisplay">💰 余额: --</div><div class="action-buttons"><button class="home-button" id="gotoMainBtn">🏠 返回首页</button><button class="back-btn" id="backToMainFromLaundry">← 换号</button></div></div><div class="categories-scroll" id="categoryNav"><div class="cat-chip" data-cat="上装">上装</div><div class="cat-chip" data-cat="下装">下装</div><div class="cat-chip" data-cat="鞋靴">鞋靴</div><div class="cat-chip" data-cat="皮质服饰">皮质服饰</div><div class="cat-chip" data-cat="箱包">箱包</div><div class="cat-chip" data-cat="其他">其他</div></div><div id="garmentsContainer" class="garments-grid"></div><div class="history-section"><div class="history-title">📋 近期常洗 · 快速加单</div><div id="historyList" class="history-list"></div></div><div id="orderDetailsPanel" class="order-detail-list"></div><div class="cart-bottom-bar"><div class="cart-stats"><div class="cart-price-info"><span>👕 件数: <strong id="totalItems">0</strong></span><span class="original-price" id="originalPriceDisplay">原价: ¥0.00</span><span class="discounted-price" id="discountedPriceDisplay">¥0.00</span></div><div class="discount-section"><label>🎯 折扣</label><input type="range" id="discountSlider" class="discount-slider" min="0" max="10" step="0.1" value="10"><input type="number" id="discountInput" class="discount-input" step="0.1" min="0" max="10" value="10"><span class="discount-unit">折</span></div></div><button class="checkout-button" id="gotoCheckoutBtn">去结算 🧾</button></div></div></div></div>

<!-- ⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡ -->
<!--   ✦ 结算确认模块 ✦       -->
<!-- ⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡⟡ -->
<div id="checkoutView" class="view hidden-view"><div class="checkout-container"><div class="checkout-header"><button class="back-btn" id="backToLaundryFromCheckout">← 返回</button><div class="checkout-title">确认订单</div></div><div class="order-summary-card" id="checkoutSummary"></div><div class="payment-methods" id="paymentMethods"><div class="payment-method" data-payment="现金">💰 现金</div><div class="payment-method" data-payment="微信">💬 微信</div><div class="payment-method" data-payment="支付宝">📱 支付宝</div><div class="payment-method" data-payment="刷卡">💳 刷卡</div><div class="payment-method" data-payment="会员余额">⭐ 会员余额</div></div><button class="confirm-order-btn" id="confirmOrderBtn">✅ 确认收衣</button></div></div>
</div>

<script>
/***********************************
* ✤ 全局数据定义

function sh(){if(cp)localStorage.setItem(`voidvow_history_${cp}`,JSON.stringify(hm.get(cp)||[]));}
function lh(){if(cp){const s=localStorage.getItem(`voidvow_history_${cp}`);if(s)try{hm.set(cp,JSON.parse(s));}catch(e){hm.set(cp,[]);}else hm.set(cp,[]);}rh();}
function ah(k){if(!cp)return;let l=hm.get(cp)||[];l=l.filter(i=>i!==k);l.unshift(k);if(l.length>8)l.pop();hm.set(cp,l);sh();rh();}
function rh(){if(!hl)return;const h=(cp&&hm.get(cp))?hm.get(cp):[];if(!h.length){hl.innerHTML='<span style="font-size:0.85rem; color:#aaa;">暂无常用</span>';return;}let html='';h.forEach(k=>{const g=G[k];if(g)html+=`<div class="history-item" data-garment="${k}">${k} ¥${g.p}</div>`;});hl.innerHTML=html;document.querySelectorAll('.history-item').forEach(el=>{el.addEventListener('click',(e)=>{const gk=el.getAttribute('data-garment');if(gk&&G[gk])atc(gk);e.stopPropagation();});});}

/***********************************
* ✤ 添加/移除衣物
 ***********************************/
function atc(k){const g=G[k];if(!g)return;const e=ca.find(i=>i.garmentKey===k);if(e)e.quantity+=1;else ca.push({garmentKey:k,name:k,price:g.p,quantity:1});uc();sc();ah(k);updatePriceDisplay();}
function rfc(k){const i=ca.findIndex(i=>i.garmentKey===k);if(i!==-1){if(ca[i].quantity>1)ca[i].quantity-=1;else ca.splice(i,1);}uc();sc();updatePriceDisplay();}
function uc(){const q=ca.reduce((s,i)=>s+i.quantity,0);ti.innerText=q;if(od){if(!ca.length)od.innerHTML='<span style="color:#aaa;">📭 暂未添加</span>';else{let h='';ca.forEach(i=>{h+=`<div class="order-item-row"><span>${i.name} x${i.quantity}</span><span>¥${(i.price*i.quantity).toFixed(2)} <button class="remove-item-btn" data-g="${i.garmentKey}">−</button></span></div>`;});od.innerHTML=h;document.querySelectorAll('.remove-item-btn').forEach(btn=>{btn.addEventListener('click',(e)=>{const gk=btn.getAttribute('data-g');if(gk)rfc(gk);e.stopPropagation();});});}}}

/***********************************
* ✤ 衣物分类和渲染
 ***********************************/
function rg(){const f=Object.entries(G).filter(([_,v])=>v.c===ac);if(!f.length){gc.innerHTML='<div style="grid-column:1/-1; text-align:center; padding:40px;">暂无</div>';return;}let h='';f.forEach(([k,v])=>{h+=`<div class="garment-card" data-garment="${k}"><div class="garment-name">${k}</div><div class="garment-price">¥${v.p}</div></div>`;});gc.innerHTML=h;document.querySelectorAll('.garment-card').forEach(c=>{c.addEventListener('click',()=>{const gk=c.getAttribute('data-garment');if(gk)atc(gk);});});}
function bc(){document.querySelectorAll('.cat-chip').forEach(c=>{c.addEventListener('click',()=>{document.querySelectorAll('.cat-chip').forEach(cc=>cc.classList.remove('active'));c.classList.add('active');ac=c.getAttribute('data-cat');rg();});});}

/***********************************
* ✤ 结算页面刷新（优化支付方式样式）
 ***********************************/
function rco(){const orig=getOriginalTotal(),disc=discount/10,fin=orig*disc;let its='';ca.forEach(i=>{its+=`<div class="summary-row"><span>${i.name} x${i.quantity}</span><span>¥${(i.price*i.quantity).toFixed(2)}</span></div>`;});cs.innerHTML=`<div class="summary-row"><strong>衣物清单</strong><span></span></div>${its}<div class="summary-row"><strong>原价</strong><span>¥${orig.toFixed(2)}</span></div><div class="summary-row"><strong>折扣</strong><span>${discount}折</span></div><div class="summary-row"><strong>实付金额</strong><span class="total-amount">¥${fin.toFixed(2)}</span></div><div class="summary-row"><span>门店</span><span>述白·滨江店</span></div><div class="summary-row"><span>客户</span><span>${cp||''}</span></div><div class="summary-row"><span>支付方式</span><span class="payment-selected">${selectedPayment}</span></div><div class="summary-row"><span>当前余额</span><span>¥${currentBalance.toFixed(2)}</span></div>`;}
function initPaymentMethods(){const methods=document.querySelectorAll('#paymentMethods .payment-method');methods.forEach(m=>{m.addEventListener('click',()=>{methods.forEach(mm=>mm.classList.remove('selected'));m.classList.add('selected');selectedPayment=m.getAttribute('data-payment');const paymentSpan=document.querySelector('#checkoutSummary .payment-selected');if(paymentSpan)paymentSpan.innerText=selectedPayment;});if(m.getAttribute('data-payment')===selectedPayment)m.classList.add('selected');});}

/***********************************
* ✤ 确认收衣/保存订单
 ***********************************/
function fo(){if(!ca.length){alert('没有衣物');return;}if(editOrderId!==null){saveEditedOrder();return;}const orig=getOriginalTotal(),disc=discount/10,fin=orig*disc,oid='VW'+Date.now().toString().slice(-8),cn=localStorage.getItem(`voidvow_name_${cp}`)||cp.slice(-4);if(selectedPayment==="会员余额"){if(currentBalance<fin){alert(`❌ 余额不足！当前余额 ¥${currentBalance.toFixed(2)}，订单金额 ¥${fin.toFixed(2)}\n请选择其他支付方式或充值`);return;}const member=members.get(cp);if(member){member.balance-=fin;members.set(cp,member);saveMembers();currentBalance=member.balance;updateBalanceDisplay();alert(`✅ 会员扣款成功！\n订单金额: ¥${fin.toFixed(2)}\n剩余余额: ¥${currentBalance.toFixed(2)}`);}else{alert('❌ 会员信息不存在，请先充值');return;}}const newOrder={id:oid,phone:cp,customerName:cn,items:JSON.parse(JSON.stringify(ca)),originalTotal:orig,total:fin,discount:discount,payment:selectedPayment,balanceAfter:currentBalance,createdAt:new Date().toISOString()};ao.unshift(newOrder);so();ro();ca=[];sc();uc();setDiscount(10);printReceipt(newOrder);sm();}

/***********************************
* ✤ 返回主界面
 ***********************************/
function sm(){switchView(mv);cp=null;ca=[];editOrderId=null;setDiscount(10);selectedPayment="现金";currentBalance=0;updateBalanceDisplay();pi.value='';le.innerText='';searchKeyword="";if(searchInput)searchInput.value="";if(filterPhone)filterPhone.checked=false;if(filterOrderId)filterOrderId.checked=false;if(filterName)filterName.checked=false;ro();}

/***********************************
* ✤ 进入洗衣下单模块
 ***********************************/
function sl(){if(!cp)return;switchView(lv);currentBalance=getMemberBalance(cp);updateBalanceDisplay();rg();uc();lh();document.querySelectorAll('.cat-chip').forEach(c=>c.classList.remove('active'));const def=document.querySelector('.cat-chip[data-cat="上装"]');if(def)def.classList.add('active');ac="上装";rg();updatePriceDisplay();}

/***********************************
* ✤ 跳转结算
 ***********************************/
function sco(){if(!ca.length){alert('请先添加衣物');return;}if(selectedPayment==="会员余额"){const orderTotal=getDiscountedTotal();if(currentBalance<orderTotal){alert(`⚠️ 余额不足！当前余额 ¥${currentBalance.toFixed(2)}，订单金额 ¥${orderTotal.toFixed(2)}\n已自动切换为现金支付`);selectedPayment="现金";}}selectedPayment=selectedPayment==="会员余额"&&currentBalance<getDiscountedTotal()?"现金":selectedPayment;initPaymentMethods();rco();switchView(cv);}

/***********************************
* ✤ 登录/切换手机号
 ***********************************/
function es(p){if(!p){le.innerText='请输入手机号';return;}if(!/^1[0-9]{10}$/.test(p)){le.innerText='❌ 11位手机号';return;}cp=p;let un=localStorage.getItem(`voidvow_name_${p}`)||getMemberName(p)||p.slice(-4);uw.innerHTML=`👤 ${un} (${p})`;currentBalance=getMemberBalance(cp);updateBalanceDisplay();editOrderId=null;setDiscount(10);lc();lh();sl();}

/***********************************
* ✤ 事件绑定
 ***********************************/
loadMembers();newUserBtn.addEventListener('click',showMemberModal);usb.addEventListener('click',cau);spi.addEventListener('keypress',(e)=>{if(e.key==='Enter')cau();});cph.addEventListener('dblclick',cpw);sb.addEventListener('click',()=>es(pi.value.trim()));pi.addEventListener('keypress',(e)=>{if(e.key==='Enter')es(pi.value.trim());});gtm.addEventListener('click',sm);btm.addEventListener('click',sm);btc.addEventListener('click',sl);gtc.addEventListener('click',sco);co.addEventListener('click',fo);uw.addEventListener('dblclick',()=>{if(!cp)return;let nn=prompt('昵称',localStorage.getItem(`voidvow_name_${cp}`)||cp.slice(-4));if(nn&&nn.trim()){localStorage.setItem(`voidvow_name_${cp}`,nn.trim());uw.innerHTML=editOrderId?`👤 ${nn.trim()} (${cp}) ✏️ 编辑模式`:`👤 ${nn.trim()} (${cp})`;}});if(discountInput){discountInput.addEventListener('input',(e)=>{setDiscount(e.target.value);});}if(discountSlider){discountSlider.addEventListener('input',(e)=>{setDiscount(e.target.value);});}if(searchInput){searchInput.addEventListener('input',(e)=>{searchKeyword=e.target.value;ro();});}if(filterPhone){filterPhone.addEventListener('change',()=>ro());}if(filterOrderId){filterOrderId.addEventListener('change',()=>ro());}if(filterName){filterName.addEventListener('change',()=>ro());}bc();switchView(pv);
</script>
</body>
</html>
