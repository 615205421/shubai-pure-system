function editOrder(order,idx){editOrderId=idx;cp=order.phone;ca=JSON.parse(JSON.stringify(order.items));setDiscount(order.discount||10);let un=localStorage.getItem(`voidvow_name_${cp}`)||cp.slice(-4);uw.innerHTML=`👤 ${un} (${cp}) ✏️ 编辑模式`;updatePriceDisplay();lc();uc();lh();mv.classList.add('hidden-view');lv.classList.remove('hidden-view');cv.classList.add('hidden-view');rg();document.querySelectorAll('.cat-chip').forEach(c=>c.classList.remove('active'));const def=document.querySelector('.cat-chip[data-cat="上装"]');if(def)def.classList.add('active');ac="上装";rg();alert(`✏️ 正在编辑订单 ${order.id}\n可调整折扣(0-10折)，完成后点击"去结算"保存`);}
function saveEditedOrder(){if(editOrderId!==null&&ao[editOrderId]){const newOriginal=getOriginalTotal(),newTotal=newOriginal*(discount/10);ao[editOrderId].items=JSON.parse(JSON.stringify(ca));ao[editOrderId].originalTotal=newOriginal;ao[editOrderId].total=newTotal;ao[editOrderId].discount=discount;ao[editOrderId].updatedAt=new Date().toISOString();so();ro();alert(`✅ 订单修改成功！${discount}折，原价 ¥${newOriginal.toFixed(2)} → 实付 ¥${newTotal.toFixed(2)}`);editOrderId=null;sm();}else{editOrderId=null;sm();}}
function ro(){if(!ola)return;if(!ao.length){ola.innerHTML='<div class="empty-orders-mini">✨ 暂无订单</div>';return;}let h='';[...ao].reverse().forEach((o,i)=>{const originalIdx=ao.length-1-i;const d=new Date(o.createdAt).toLocaleString('zh-CN'),its=o.items.slice(0,2).map(i=>`${i.name} x${i.quantity}`).join('、')+(o.items.length>2?` 等${o.items.length}件`:'');h+=`<div class="order-card-mini"><div class="order-header-mini"><span class="order-id-mini">${o.id}</span><span class="order-date-mini">${d}</span><span class="order-total-mini">¥${o.total.toFixed(2)}</span></div><div class="order-items-mini">📦 ${its}</div><div class="order-customer-mini">👤 ${o.customerName} (${o.phone})</div><div class="order-actions-mini"><button class="detail-order-btn" data-idx="${originalIdx}">📋 查看详情</button><button class="edit-order-btn" data-idx="${originalIdx}">✏️ 二次编辑</button><button class="print-order-btn" data-idx="${originalIdx}">🖨️ 打印小票</button></div></div>`;});ola.innerHTML=h;
document.querySelectorAll('.detail-order-btn').forEach(btn=>{btn.addEventListener('click',(e)=>{const idx=parseInt(btn.getAttribute('data-idx'));if(!isNaN(idx)&&ao[idx])showOrderDetail(ao[idx]);});});
document.querySelectorAll('.edit-order-btn').forEach(btn=>{btn.addEventListener('click',(e)=>{const idx=parseInt(btn.getAttribute('data-idx'));if(!isNaN(idx)&&ao[idx])editOrder(ao[idx],idx);});});
document.querySelectorAll('.print-order-btn').forEach(btn=>{btn.addEventListener('click',(e)=>{const idx=parseInt(btn.getAttribute('data-idx'));if(!isNaN(idx)&&ao[idx])printReceipt(ao[idx]);});});}
function cao(){if(!ao.length)return;if(confirm('清空所有订单？')){ao=[];so();ro();}}
function sc(){if(cp)localStorage.setItem(`voidvow_cart_${cp}`,JSON.stringify(ca));}
function lc(){if(cp){const s=localStorage.getItem(`voidvow_cart_${cp}`);if(editOrderId===null)ca=s?JSON.parse(s):[];}else ca=[];uc();}
function sh(){if(cp)localStorage.setItem(`voidvow_history_${cp}`,JSON.stringify(hm.get(cp)||[]));}
function lh(){if(cp){const s=localStorage.getItem(`voidvow_history_${cp}`);if(s)try{hm.set(cp,JSON.parse(s));}catch(e){hm.set(cp,[]);}else hm.set(cp,[]);}rh();}
function ah(k){if(!cp)return;let l=hm.get(cp)||[];l=l.filter(i=>i!==k);l.unshift(k);if(l.length>8)l.pop();hm.set(cp,l);sh();rh();}
function rh(){if(!hl)return;const h=(cp&&hm.get(cp))?hm.get(cp):[];if(!h.length){hl.innerHTML='<span style="font-size:0.85rem; color:#aaa;">暂无常用</span>';return;}let html='';h.forEach(k=>{const g=G[k];if(g)html+=`<div class="history-item" data-garment="${k}">${k} ¥${g.p}</div>`;});hl.innerHTML=html;document.querySelectorAll('.history-item').forEach(el=>{el.addEventListener('click',(e)=>{const gk=el.getAttribute('data-garment');if(gk&&G[gk])atc(gk);e.stopPropagation();});});}
function atc(k){const g=G[k];if(!g)return;const e=ca.find(i=>i.garmentKey===k);if(e)e.quantity+=1;else ca.push({garmentKey:k,name:k,price:g.p,quantity:1});uc();sc();ah(k);updatePriceDisplay();}
function rfc(k){const i=ca.findIndex(i=>i.garmentKey===k);if(i!==-1){if(ca[i].quantity>1)ca[i].quantity-=1;else ca.splice(i,1);}uc();sc();updatePriceDisplay();}
function uc(){const q=ca.reduce((s,i)=>s+i.quantity,0);ti.innerText=q;if(od){if(!ca.length)od.innerHTML='<span style="color:#aaa;">📭 暂未添加</span>';else{let h='';ca.forEach(i=>{h+=`<div class="order-item-row"><span>${i.name} x${i.quantity}</span><span>¥${(i.price*i.quantity).toFixed(2)} <button class="remove-item-btn" data-g="${i.garmentKey}">−</button></span></div>`;});od.innerHTML=h;document.querySelectorAll('.remove-item-btn').forEach(btn=>{btn.addEventListener('click',(e)=>{const gk=btn.getAttribute('data-g');if(gk)rfc(gk);e.stopPropagation();});});}}}
function rg(){const f=Object.entries(G).filter(([_,v])=>v.c===ac);if(!f.length){gc.innerHTML='<div style="grid-column:1/-1; text-align:center; padding:40px;">暂无</div>';return;}let h='';f.forEach(([k,v])=>{h+=`<div class="garment-card" data-garment="${k}"><div class="garment-name">${k}</div><div class="garment-price">¥${v.p}</div></div>`;});gc.innerHTML=h;document.querySelectorAll('.garment-card').forEach(c=>{c.addEventListener('click',()=>{const gk=c.getAttribute('data-garment');if(gk)atc(gk);});});}
function bc(){document.querySelectorAll('.cat-chip').forEach(c=>{c.addEventListener('click',()=>{document.querySelectorAll('.cat-chip').forEach(cc=>cc.classList.remove('active'));c.classList.add('active');ac=c.getAttribute('data-cat');rg();});});}
function rco(){const orig=getOriginalTotal(),disc=discount/10,fin=orig*disc;let its='';ca.forEach(i=>{its+=`<div class="summary-row"><span>${i.name} x${i.quantity}</span><span>¥${(i.price*i.quantity).toFixed(2)}</span></div>`;});cs.innerHTML=`<div class="summary-row"><strong>衣物清单</strong><span></span></div>${its}<div class="summary-row"><strong>原价</strong><span>¥${orig.toFixed(2)}</span></div><div class="summary-row"><strong>折扣</strong><span>${discount}折</span></div><div class="summary-row"><strong>实付金额</strong><span class="total-amount">¥${fin.toFixed(2)}</span></div><div class="summary-row"><span>门店</span><span>述白·滨江店</span></div><div class="summary-row"><span>客户</span><span>${cp||''}</span></div>`;}
function fo(){if(!ca.length){alert('没有衣物');return;}if(editOrderId!==null){saveEditedOrder();return;}const orig=getOriginalTotal(),disc=discount/10,fin=orig*disc,oid='VW'+Date.now().toString().slice(-8),cn=localStorage.getItem(`voidvow_name_${cp}`)||cp.slice(-4),newOrder={id:oid,phone:cp,customerName:cn,items:JSON.parse(JSON.stringify(ca)),originalTotal:orig,total:fin,discount:discount,createdAt:new Date().toISOString()};ao.unshift(newOrder);so();ro();ca=[];sc();uc();setDiscount(10);alert(`✅ 订单 ${oid}\n${discount}折，原价 ¥${orig.toFixed(2)} → 实付 ¥${fin.toFixed(2)}`);printReceipt(newOrder);sm();}
function sm(){mv.classList.remove('hidden-view');lv.classList.add('hidden-view');cv.classList.add('hidden-view');cp=null;ca=[];editOrderId=null;setDiscount(10);pi.value='';le.innerText='';ro();}
function sl(){if(!cp)return;mv.classList.add('hidden-view');lv.classList.remove('hidden-view');cv.classList.add('hidden-view');rg();uc();lh();document.querySelectorAll('.cat-chip').forEach(c=>c.classList.remove('active'));const def=document.querySelector('.cat-chip[data-cat="上装"]');if(def)def.classList.add('active');ac="上装";rg();updatePriceDisplay();}
function sco(){if(!ca.length){alert('请先添加衣物');return;}rco();mv.classList.add('hidden-view');lv.classList.add('hidden-view');cv.classList.remove('hidden-view');}
function es(p){if(!p){le.innerText='请输入手机号';return;}if(!/^1[0-9]{10}$/.test(p)){le.innerText='❌ 11位手机号';return;}cp=p;let un=localStorage.getItem(`voidvow_name_${p}`)||p.slice(-4);uw.innerHTML=`👤 ${un} (${p})`;editOrderId=null;setDiscount(10);lc();lh();sl();}
usb.addEventListener('click',cau);spi.addEventListener('keypress',(e)=>{if(e.key==='Enter')cau();});cph.addEventListener('dblclick',cpw);sb.addEventListener('click',()=>es(pi.value.trim()));pi.addEventListener('keypress',(e)=>{if(e.key==='Enter')es(pi.value.trim());});gtm.addEventListener('click',sm);btm.addEventListener('click',sm);btc.addEventListener('click',sl);gtc.addEventListener('click',sco);co.addEventListener('click',fo);cob.addEventListener('click',cao);uw.addEventListener('dblclick',()=>{if(!cp)return;let nn=prompt('昵称',localStorage.getItem(`voidvow_name_${cp}`)||cp.slice(-4));if(nn&&nn.trim()){localStorage.setItem(`voidvow_name_${cp}`,nn.trim());uw.innerHTML=editOrderId?`👤 ${nn.trim()} (${cp}) ✏️ 编辑模式`:`👤 ${nn.trim()} (${cp})`;}});if(discountInput){discountInput.addEventListener('input',(e)=>{setDiscount(e.target.value);});}if(discountSlider){discountSlider.addEventListener('input',(e)=>{setDiscount(e.target.value);});}bc();pv.classList.remove('hidden-view');mv.classList.add('hidden-view');lv.classList.add('hidden-view');cv.classList.add('hidden-view');
</script>
</body>
