<!DOCTYPE html>

<title>述白·voidvow 极简洗衣管家</title>
<style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{background:#fff;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#111;min-height:100vh;width:100%;overflow-x:hidden}.app-full{width:100%;max-width:100%;margin:0 auto;background:#fff;min-height:100vh;display:flex;flex-direction:column}.top-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 24px;border-bottom:1px solid #f0f0f0;flex-wrap:wrap;background:#fff}.logo h1{font-size:1.6rem;font-weight:600;letter-spacing:-0.5px;color:#000}.logo h1 span{font-weight:300;color:#6c6c70}.logo p{font-size:.7rem;color:#6c6c70;letter-spacing:.5px}.shop-info{display:flex;gap:20px;font-size:.75rem;color:#3a3a3c}.view{flex:1;width:100%;transition:opacity .2s ease}.hidden-view{display:none}.back-btn{background:0 0;border:1px solid #ddd;padding:6px 16px;border-radius:40px;font-size:.75rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .2s}.back-btn:hover{background:#f5f5f7}.phone-orders-container{max-width:900px;margin:0 auto;padding:24px}.login-section{background:#fafafc;border-radius:32px;padding:28px 24px;margin-bottom:32px;text-align:center;border:1px solid #efeff4}.login-icon{font-size:2.8rem;margin-bottom:12px}.login-title{font-size:1.4rem;font-weight:600;margin-bottom:8px;color:#000}.login-desc{color:#6c6c70;font-size:.8rem;margin-bottom:24px}.phone-input-wrapper{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.phone-input-wrapper input{flex:2;min-width:200px;padding:14px 20px;font-size:1rem;border:1px solid #e5e5ea;border-radius:48px;background:#fff;font-family:monospace;outline:0;transition:.2s}.phone-input-wrapper input:focus{border-color:#000;box-shadow:0 0 0 2px rgba(0,0,0,.05)}.enter-btn{background:#000;color:#fff;border:none;padding:0 32px;border-radius:48px;font-weight:600;font-size:.95rem;cursor:pointer;transition:.2s}.enter-btn:active{transform:scale(.97)}.error-hint{color:#ff3b30;font-size:.7rem;margin-top:12px}.orders-section{background:#fff;border-radius:32px;border:1px solid #efeff4;overflow:hidden}.orders-section-header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;background:#fafafc;border-bottom:1px solid #efefef;flex-wrap:wrap;gap:12px}.orders-section-header h3{font-size:1.1rem;font-weight:600;display:flex;align-items:center;gap:8px}.clear-orders-btn{background:0 0;border:1px solid #ffccc7;padding:6px 14px;border-radius:30px;font-size:.7rem;color:#d4380d;cursor:pointer;transition:.2s}.clear-orders-btn:hover{background:#fff1f0}.orders-list-area{max-height:420px;overflow-y:auto;padding:4px 0}.order-card-mini{background:#fff;border-bottom:1px solid #f0f0f0;padding:16px 20px;transition:.1s}.order-card-mini:last-child{border-bottom:none}.order-header-mini{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}.order-id-mini{font-weight:700;font-family:monospace;font-size:.7rem;background:#f5f5f7;padding:2px 12px;border-radius:20px}.order-date-mini{font-size:.65rem;color:#8e8e93}.order-total-mini{font-weight:700;font-size:1rem}.order-items-mini{font-size:.75rem;color:#555;margin-top:6px}.order-customer-mini{font-size:.7rem;color:#6c6c70;margin-top:6px;display:inline-block;background:#f5f5f7;padding:2px 12px;border-radius:20px}.empty-orders-mini{text-align:center;padding:48px 20px;color:#aaa;font-size:.85rem}.user-welcome{display:flex;justify-content:space-between;align-items:center;padding:12px 24px;background:#fafafc;border-bottom:1px solid #efefef;flex-wrap:wrap}.categories-scroll{overflow-x:auto;white-space:nowrap;padding:16px 24px;display:flex;gap:12px;border-bottom:1px solid #f0f0f0;scrollbar-width:thin}.cat-chip{display:inline-block;padding:8px 22px;background:#f5f5f7;border-radius:40px;font-size:.85rem;font-weight:500;cursor:pointer;transition:.2s}.cat-chip.active{background:#000;color:#fff}.garments-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;padding:24px}.garment-card{background:#fff;border:1px solid #efeff4;border-radius:24px;padding:16px 8px;text-align:center;cursor:pointer;transition:.1s}.garment-card:active{transform:scale(.97);background:#fafafc}.garment-name{font-weight:600;font-size:.9rem;margin-bottom:6px}.garment-price{font-size:.9rem;font-weight:700;color:#000}.history-section{padding:8px 24px 20px;border-top:1px solid #f2f2f5}.history-title{font-size:.75rem;font-weight:500;color:#8e8e93;margin-bottom:12px}.history-list{display:flex;flex-wrap:wrap;gap:10px}.history-item{background:#f5f5f7;padding:8px 18px;border-radius:40px;font-size:.8rem;cursor:pointer;transition:.1s}.history-item:active{background:#e8e8ed}.cart-bottom-bar{background:#fff;border-top:1px solid #efefef;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;position:sticky;bottom:0;box-shadow:0 -2px 8px rgba(0,0,0,.02)}.cart-stats{display:flex;gap:24px;align-items:baseline;font-size:.9rem}.cart-total{font-size:1.5rem;font-weight:800}.checkout-button,.home-button{background:#000;color:#fff;border:none;padding:12px 24px;border-radius:44px;font-weight:600;cursor:pointer;transition:.2s}.home-button{background:#2c2c2e;margin-right:8px}.order-detail-list{padding:12px 24px 8px;font-size:.75rem;background:#fefefe;border-top:.5px solid #f0f0f0}.order-item-row{display:flex;justify-content:space-between;margin-bottom:6px}.remove-item-btn{background:0 0;border:none;color:#888;font-size:.7rem;margin-left:8px;cursor:pointer}.checkout-container{max-width:800px;margin:0 auto;padding:24px}.checkout-header{display:flex;align-items:center;gap:16px;margin-bottom:28px;padding-bottom:12px;border-bottom:1px solid #efefef}.checkout-title{font-size:1.4rem;font-weight:600}.order-summary-card{background:#fafafc;border-radius:28px;padding:20px;margin-bottom:24px}.summary-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #efefef}.summary-row:last-child{border-bottom:none}.total-amount{font-size:1.3rem;font-weight:800}.confirm-order-btn{background:#000;color:#fff;width:100%;padding:16px;border-radius:60px;font-weight:600;border:none;margin-top:20px;cursor:pointer}@media (max-width:640px){.garments-grid{grid-template-columns:repeat(2,1fr);padding:16px;gap:12px}.categories-scroll,.user-welcome,.cart-bottom-bar{padding:12px 16px}.top-bar{padding:12px 16px}.phone-orders-container{padding:16px}}button,.garment-card,.cat-chip,.history-item{cursor:pointer;user-select:none}.action-buttons{display:flex;gap:12px;align-items:center}</style>
</head>
<body>
<div class="app-full">
<div class="top-bar"><div class="logo"><h1>述白 <span>voidvow</span></h1><p>极简洗衣 · 净澈如初</p></div><div class="shop-info"><span>🏠 述白·滨江店</span><span>📞 15946898160</span></div></div>
<div id="passwordView" class="view"><div class="phone-orders-container" style="max-width:500px;padding-top:60px"><div class="login-section"><div class="login-icon">🔐</div><div class="login-title">系统登入</div><div class="login-desc">请输入管理密码进入洗衣系统</div><div class="phone-input-wrapper" style="flex-direction:column;gap:16px"><input type="password" id="systemPasswordInput" placeholder="管理密码" autocomplete="off" style="text-align:center"><button class="enter-btn" id="unlockSystemBtn">解锁系统 →</button></div><div id="passwordError" class="error-hint"></div><div style="margin-top:24px;font-size:.65rem;color:#bbb;cursor:pointer;text-align:center" id="changePwdHint">🔑 双击修改密码</div></div></div></div>
<div id="mainView" class="view hidden-view"><div class="phone-orders-container"><div class="login-section"><div class="login-icon">🌿✨</div><div class="login-title">开始收衣</div><div class="login-desc">输入手机号，进入述白洗衣系统</div><div class="phone-input-wrapper"><input type="tel" id="phoneInput" placeholder="手机号码" maxlength="11" autocomplete="off"><button class="enter-btn" id="startLaundryBtn">进入收衣 →</button></div><div id="loginError" class="error-hint"></div></div><div class="orders-section"><div class="orders-section-header"><h3>📋 全部收衣订单</h3><button class="clear-orders-btn" id="clearOrdersBtn">清空所有订单</button></div><div class="orders-list-area" id="ordersListArea"></div></div></div></div>
<div id="laundryView" class="view hidden-view"><div class="laundry-main"><div class="user-welcome"><div class="user-info" id="userWelcomeSpan">👤 顾客: --</div><div class="action-buttons"><button class="home-button" id="gotoMainBtn">🏠 返回首页</button><button class="back-btn" id="backToMainFromLaundry">← 返回/换号</button></div></div><div class="categories-scroll" id="categoryNav"><div class="cat-chip" data-cat="上装">上装</div><div class="cat-chip" data-cat="下装">下装</div><div class="cat-chip" data-cat="鞋靴">鞋靴</div><div class="cat-chip" data-cat="皮质服饰">皮质服饰</div><div class="cat-chip" data-cat="箱包">箱包</div><div class="cat-chip" data-cat="其他">其他</div></div><div id="garmentsContainer" class="garments-grid"></div><div class="history-section"><div class="history-title">📋 近期常洗 · 快速加单</div><div id="historyList" class="history-list"></div></div><div id="orderDetailsPanel" class="order-detail-list"></div><div class="cart-bottom-bar"><div class="cart-stats"><span>👕 件数: <strong id="totalItems">0</strong></span><span>💰 合计: <span id="totalPriceSpan" class="cart-total">0.00</span> 元</span></div><button class="checkout-button" id="gotoCheckoutBtn">去结算 🧾</button></div></div></div>
<div id="checkoutView" class="view hidden-view"><div class="checkout-container"><div class="checkout-header"><button class="back-btn" id="backToLaundryFromCheckout">← 返回继续加衣</button><div class="checkout-title">确认订单</div></div><div class="order-summary-card" id="checkoutSummary"></div><button class="confirm-order-btn" id="confirmOrderBtn">✅ 确认收衣 · 完成订单</button></div></div>
</div>
<script>
const G={"小香衣":{c:"上装",p:50},"牛仔衣":{c:"上装",p:40},"真丝衬衫":{c:"上装",p:40},"衬衫":{c:"上装",p:20},"真丝T恤":{c:"上装",p:40},"T恤":{c:"上装",p:20},"西服":{c:"上装",p:30},"夹克":{c:"上装",p:30},"卫衣":{c:"上装",p:30},"短款毛衣":{c:"上装",p:30},"中款毛衣":{c:"上装",p:40},"长款毛衣":{c:"上装",p:50},"吊带背心":{c:"上装",p:15},"短款风衣":{c:"上装",p:40},"中款风衣":{c:"上装",p:50},"长款风衣":{c:"上装",p:60},"短款羽绒服":{c:"上装",p:40},"中款羽绒服":{c:"上装",p:50},"长款羽绒服":{c:"上装",p:60},"羽绒背心":{c:"上装",p:35},"羊绒背心":{c:"上装",p:30},"短款仿皮外套":{c:"上装",p:70},"中款仿皮外套":{c:"上装",p:80},"长款仿皮外套":{c:"上装",p:90},"短款呢子外套":{c:"上装",p:70},"中款呢子外套":{c:"上装",p:80},"短款人造皮外套":{c:"上装",p:70},"中款人造皮外套":{c:"上装",p:80},"牛仔裤":{c:"下装",p:30},"休闲裤":{c:"下装",p:25},"西裤":{c:"下装",p:28},"短裙":{c:"下装",p:25},"长裙":{c:"下装",p:35},"运动裤":{c:"下装",p:25},"运动鞋":{c:"鞋靴",p:35},"皮鞋":{c:"鞋靴",p:45},"靴子":{c:"鞋靴",p:55},"帆布鞋":{c:"鞋靴",p:30},"皮夹克":{c:"皮质服饰",p:80},"皮衣":{c:"皮质服饰",p:85},"皮裤":{c:"皮质服饰",p:70},"手提包":{c:"箱包",p:45},"双肩包":{c:"箱包",p:40},"单肩包":{c:"箱包",p:42},"旅行箱":{c:"箱包",p:70},"围巾":{c:"其他",p:18},"帽子":{c:"其他",p:15},"领带":{c:"其他",p:12}};
let cp=null,ca=[],ac="上装",hm=new Map,ao=[],ul=false;
const pv=document.getElementById('passwordView'),mv=document.getElementById('mainView'),lv=document.getElementById('laundryView'),cv=document.getElementById('checkoutView'),pi=document.getElementById('phoneInput'),sb=document.getElementById('startLaundryBtn'),le=document.getElementById('loginError'),uw=document.getElementById('userWelcomeSpan'),gc=document.getElementById('garmentsContainer'),hl=document.getElementById('historyList'),od=document.getElementById('orderDetailsPanel'),ti=document.getElementById('totalItems'),tp=document.getElementById('totalPriceSpan'),gtc=document.getElementById('gotoCheckoutBtn'),gtm=document.getElementById('gotoMainBtn'),btm=document.getElementById('backToMainFromLaundry'),btc=document.getElementById('backToLaundryFromCheckout'),co=document.getElementById('confirmOrderBtn'),cs=document.getElementById('checkoutSummary'),ola=document.getElementById('ordersListArea'),cob=document.getElementById('clearOrdersBtn'),spi=document.getElementById('systemPasswordInput'),usb=document.getElementById('unlockSystemBtn'),pwe=document.getElementById('passwordError'),cph=document.getElementById('changePwdHint');
let sp=localStorage.getItem('voidvow_admin_pwd')||'shwysh30';
function sps(){localStorage.setItem('voidvow_admin_pwd',sp);}
function cau(){const ip=spi.value.trim();if(!ip){pwe.innerText='请输入密码';return false;}if(ip===sp){ul=true;pwe.innerText='';pv.classList.add('hidden-view');mv.classList.remove('hidden-view');lo();ro();return true;}else{pwe.innerText='❌ 密码错误，请重试';spi.value='';return false;}}
function cpw(){const np=prompt('修改管理密码','');if(np&&np.trim().length>=3){sp=np.trim();sps();alert('✅ 密码修改成功');}else if(np&&np.trim().length<3){alert('密码至少需要3位字符');}}
function so(){localStorage.setItem('voidvow_orders',JSON.stringify(ao));}
function lo(){const s=localStorage.getItem('voidvow_orders');ao=s?JSON.parse(s):[];ro();}
function ro(){if(!ola)return;if(!ao.length){ola.innerHTML='<div class="empty-orders-mini">✨ 暂无收衣订单，请点击上方「进入收衣」开始接单～</div>';return;}let h='';[...ao].reverse().forEach(o=>{const d=new Date(o.createdAt).toLocaleString('zh-CN'),its=o.items.map(i=>`${i.name} x${i.quantity}`).join('、');h+=`<div class="order-card-mini"><div class="order-header-mini"><span class="order-id-mini">${o.id}</span><span class="order-date-mini">${d}</span><span class="order-total-mini">¥${o.total.toFixed(2)}</span></div><div class="order-items-mini">📦 ${its}</div><div class="order-customer-mini">👤 ${o.customerName} (${o.phone})</div></div>`;});ola.innerHTML=h;}
function cao(){if(!ao.length)return;if(confirm('⚠️ 确定要清空所有历史订单吗？数据不可恢复。')){ao=[];so();ro();}}
function sc(){if(cp)localStorage.setItem(`voidvow_cart_${cp}`,JSON.stringify(ca));}
function lc(){if(cp){const s=localStorage.getItem(`voidvow_cart_${cp}`);ca=s?JSON.parse(s):[];}else ca=[];uc();}
function sh(){if(cp)localStorage.setItem(`voidvow_history_${cp}`,JSON.stringify(hm.get(cp)||[]));}
function lh(){if(cp){const s=localStorage.getItem(`voidvow_history_${cp}`);if(s)try{hm.set(cp,JSON.parse(s));}catch(e){hm.set(cp,[]);}else hm.set(cp,[]);}rh();}
function ah(k){if(!cp)return;let l=hm.get(cp)||[];l=l.filter(i=>i!==k);l.unshift(k);if(l.length>8)l.pop();hm.set(cp,l);sh();rh();}
function rh(){if(!hl)return;const h=(cp&&hm.get(cp))?hm.get(cp):[];if(!h.length){hl.innerHTML='<span style="font-size:0.7rem; color:#aaa;">暂无常用衣物，点击衣物后快速加单</span>';return;}let html='';h.forEach(k=>{const g=G[k];if(g)html+=`<div class="history-item" data-garment="${k}">${k} ¥${g.p}</div>`;});hl.innerHTML=html;document.querySelectorAll('.history-item').forEach(el=>{el.addEventListener('click',(e)=>{const gk=el.getAttribute('data-garment');if(gk&&G[gk])atc(gk);e.stopPropagation();});});}
function atc(k){const g=G[k];if(!g)return;const e=ca.find(i=>i.garmentKey===k);if(e)e.quantity+=1;else ca.push({garmentKey:k,name:k,price:g.p,quantity:1});uc();sc();ah(k);}
function rfc(k){const i=ca.findIndex(i=>i.garmentKey===k);if(i!==-1){if(ca[i].quantity>1)ca[i].quantity-=1;else ca.splice(i,1);}uc();sc();}
function uc(){const q=ca.reduce((s,i)=>s+i.quantity,0),a=ca.reduce((s,i)=>s+(i.price*i.quantity),0);ti.innerText=q;tp.innerText=a.toFixed(2);if(od){if(!ca.length)od.innerHTML='<span style="color:#aaa;">📭 暂未添加衣物，点击上方服饰开始收衣</span>';else{let h='';ca.forEach(i=>{h+=`<div class="order-item-row"><span>${i.name} x${i.quantity}</span><span>¥${(i.price*i.quantity).toFixed(2)} <button class="remove-item-btn" data-g="${i.garmentKey}">−</button></span></div>`;});od.innerHTML=h;document.querySelectorAll('.remove-item-btn').forEach(btn=>{btn.addEventListener('click',(e)=>{const gk=btn.getAttribute('data-g');if(gk)rfc(gk);e.stopPropagation();});});}}}
function rg(){const f=Object.entries(G).filter(([_,v])=>v.c===ac);if(!f.length){gc.innerHTML='<div style="grid-column:1/-1; text-align:center; padding:40px;">暂无此类衣物</div>';return;}let h='';f.forEach(([k,v])=>{h+=`<div class="garment-card" data-garment="${k}"><div class="garment-name">${k}</div><div class="garment-price">¥${v.p}</div></div>`;});gc.innerHTML=h;document.querySelectorAll('.garment-card').forEach(c=>{c.addEventListener('click',()=>{const gk=c.getAttribute('data-garment');if(gk)atc(gk);});});}
function bc(){document.querySelectorAll('.cat-chip').forEach(c=>{c.addEventListener('click',()=>{document.querySelectorAll('.cat-chip').forEach(cc=>cc.classList.remove('active'));c.classList.add('active');ac=c.getAttribute('data-cat');rg();});});}
function rco(){const a=ca.reduce((s,i)=>s+(i.price*i.quantity),0);let its='';ca.forEach(i=>{its+=`<div class="summary-row"><span>${i.name} x${i.quantity}</span><span>¥${(i.price*i.quantity).toFixed(2)}</span></div>`;});cs.innerHTML=`<div class="summary-row"><strong>衣物清单</strong><span></span></div>${its}<div class="summary-row"><strong>总计金额</strong><span class="total-amount">¥${a.toFixed(2)}</span></div><div class="summary-row"><span>收衣门店</span><span>述白·滨江店</span></div><div class="summary-row"><span>客户手机</span><span>${cp||''}</span></div>`;}
function fo(){if(!ca.length){alert('没有衣物可结算');return;}const a=ca.reduce((s,i)=>s+(i.price*i.quantity),0),oid='VW'+Date.now().toString().slice(-8),cn=localStorage.getItem(`voidvow_name_${cp}`)||cp.slice(-4);ao.unshift({id:oid,phone:cp,customerName:cn,items:JSON.parse(JSON.stringify(ca)),total:a,createdAt:new Date().toISOString()});so();ro();ca=[];sc();uc();alert(`✅ 收衣成功！订单 ${oid} 总金额 ¥${a.toFixed(2)}`);sm();}
function sm(){mv.classList.remove('hidden-view');lv.classList.add('hidden-view');cv.classList.add('hidden-view');cp=null;ca=[];pi.value='';le.innerText='';ro();}
function sl(){if(!cp)return;mv.classList.add('hidden-view');lv.classList.remove('hidden-view');cv.classList.add('hidden-view');rg();uc();lh();document.querySelectorAll('.cat-chip').forEach(c=>c.classList.remove('active'));const def=document.querySelector('.cat-chip[data-cat="上装"]');if(def)def.classList.add('active');ac="上装";rg();}
function sco(){if(!ca.length){alert('请先添加衣物再结算');return;}rco();mv.classList.add('hidden-view');lv.classList.add('hidden-view');cv.classList.remove('hidden-view');}
function es(p){if(!p){le.innerText='请输入手机号';return false;}if(!/^1[0-9]{10}$/.test(p)){le.innerText='❌ 请输入11位有效手机号';return false;}cp=p;let un=localStorage.getItem(`voidvow_name_${p}`)||p.slice(-4);uw.innerHTML=`👤 ${un} (${p}) | 会员`;lc();lh();sl();return true;}
usb.addEventListener('click',cau);spi.addEventListener('keypress',(e)=>{if(e.key==='Enter')cau();});cph.addEventListener('dblclick',cpw);sb.addEventListener('click',()=>es(pi.value.trim()));pi.addEventListener('keypress',(e)=>{if(e.key==='Enter')es(pi.value.trim());});gtm.addEventListener('click',sm);btm.addEventListener('click',sm);btc.addEventListener('click',sl);gtc.addEventListener('click',sco);co.addEventListener('click',fo);cob.addEventListener('click',cao);uw.addEventListener('dblclick',()=>{if(!cp)return;let nn=prompt('编辑顾客昵称',localStorage.getItem(`voidvow_name_${cp}`)||cp.slice(-4));if(nn&&nn.trim()){localStorage.setItem(`voidvow_name_${cp}`,nn.trim());uw.innerHTML=`👤 ${nn.trim()} (${cp}) | 会员`;}});
bc();pv.classList.remove('hidden-view');mv.classList.add('hidden-view');lv.classList.add('hidden-view');cv.classList.add('hidden-view');
</script>
</body>
</html>
