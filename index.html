<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>UCC国际洗衣 · 极速收衣系统</title>
    <style>
        /* 全局重置 - 全屏适配，无多余边框卡片限制 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #ffffff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #111;
            min-height: 100vh;
            width: 100%;
            overflow-x: hidden;
        }

        /* 主应用容器 - 全屏流式布局，无边框圆角限制 */
        .app-full {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            background: #ffffff;
        }

        /* 状态栏/顶部信息 - 极简线条 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            border-bottom: 1px solid #f0f0f0;
            flex-wrap: wrap;
            background: white;
        }
        .logo h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: #000;
        }
        .logo p {
            font-size: 0.7rem;
            color: #6c6c70;
        }
        .shop-info {
            display: flex;
            gap: 20px;
            font-size: 0.75rem;
            color: #3a3a3c;
        }

        /* 双视图切换: 视图1 电话入口界面 / 视图2 收衣主系统 */
        .view {
            width: 100%;
            transition: opacity 0.2s ease;
        }
        .hidden-view {
            display: none;
        }

        /* 电话登录界面 (全屏独立, 干净简洁) */
        .phone-login-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 70vh;
            padding: 40px 24px;
            background: #ffffff;
        }
        .login-card {
            max-width: 460px;
            width: 100%;
            margin: 0 auto;
            text-align: center;
        }
        .login-icon {
            font-size: 3.8rem;
            margin-bottom: 24px;
        }
        .login-title {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }
        .login-desc {
            color: #6c6c70;
            font-size: 0.9rem;
            margin-bottom: 32px;
        }
        .phone-input-wrapper {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .phone-input-wrapper input {
            flex: 2;
            min-width: 200px;
            padding: 16px 20px;
            font-size: 1rem;
            border: 1px solid #e5e5ea;
            border-radius: 48px;
            background: #f9f9fb;
            font-family: monospace;
            outline: none;
            transition: 0.2s;
        }
        .phone-input-wrapper input:focus {
            border-color: #000;
            background: white;
        }
        .enter-btn {
            background: #000000;
            color: white;
            border: none;
            padding: 0 32px;
            border-radius: 48px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .enter-btn:active { transform: scale(0.97);}
        .error-hint {
            color: #ff3b30;
            font-size: 0.75rem;
            margin-top: 16px;
        }

        /* 收衣主界面 (全宽无框) */
        .laundry-main {
            background: #ffffff;
            width: 100%;
        }

        /* 用户欢迎条 + 切换出口 */
        .user-welcome {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background: #fafafc;
            border-bottom: 1px solid #efefef;
            flex-wrap: wrap;
        }
        .user-info {
            font-weight: 500;
            font-size: 0.9rem;
        }
        .switch-phone-btn {
            background: none;
            border: 1px solid #ddd;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        /* 分类横向滚动 */
        .categories-scroll {
            overflow-x: auto;
            white-space: nowrap;
            padding: 16px 24px;
            display: flex;
            gap: 12px;
            border-bottom: 1px solid #f0f0f0;
            scrollbar-width: thin;
        }
        .cat-chip {
            display: inline-block;
            padding: 8px 22px;
            background: #f5f5f7;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .cat-chip.active {
            background: #000000;
            color: white;
        }

        /* 衣物网格：响应式 grid，电脑端自动伸展 */
        .garments-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 16px;
            padding: 24px;
            background: #ffffff;
        }
        .garment-card {
            background: #ffffff;
            border: 1px solid #efeff4;
            border-radius: 24px;
            padding: 16px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.1s ease;
        }
        .garment-card:active { transform: scale(0.97); background: #fafafc; }
        .garment-name {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 6px;
        }
        .garment-price {
            font-size: 0.9rem;
            font-weight: 700;
            color: #000;
        }

        /* 历史常用模块 */
        .history-section {
            padding: 8px 24px 20px;
            border-top: 1px solid #f2f2f5;
            background: white;
        }
        .history-title {
            font-size: 0.75rem;
            font-weight: 500;
            color: #8e8e93;
            margin-bottom: 12px;
        }
        .history-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .history-item {
            background: #f5f5f7;
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        /* 底部购物车栏：固定于视口底部但跟随文档流 */
        .cart-bottom-bar {
            background: #ffffff;
            border-top: 1px solid #efefef;
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            position: sticky;
            bottom: 0;
            z-index: 10;
            box-shadow: 0 -2px 8px rgba(0,0,0,0.02);
        }
        .cart-stats {
            display: flex;
            gap: 24px;
            align-items: baseline;
            font-size: 0.9rem;
        }
        .cart-total {
            font-size: 1.5rem;
            font-weight: 800;
        }
        .checkout-button {
            background: #000;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 44px;
            font-weight: 600;
            cursor: pointer;
        }
        .order-detail-list {
            padding: 12px 24px 8px;
            font-size: 0.75rem;
            background: #fefefe;
            border-top: 0.5px solid #f0f0f0;
            color: #3a3a3c;
        }
        .order-item-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        .remove-item-btn {
            background: none;
            border: none;
            color: #888;
            font-size: 0.7rem;
            margin-left: 8px;
            cursor: pointer;
        }

        @media (max-width: 640px) {
            .garments-grid {
                grid-template-columns: repeat(2, 1fr);
                padding: 16px;
                gap: 12px;
            }
            .categories-scroll { padding: 12px 16px; }
            .cart-bottom-bar { padding: 12px 16px; }
            .user-welcome { padding: 10px 16px; }
        }
        button, .garment-card, .cat-chip, .history-item { cursor: pointer; user-select: none; }
    </style>
</head>
<body>
<div class="app-full">
    <!-- 顶部通用栏 -->
    <div class="top-bar">
        <div class="logo">
            <h1>UCC 国际洗衣</h1>
            <p>极速收衣 · 专业洁净</p>
        </div>
        <div class="shop-info">
            <span>🏠 UCC福德酒店</span>
            <span>📞 15946898160</span>
        </div>
    </div>

    <!-- 视图1: 电话入口界面 (独立页面感) -->
    <div id="phoneView" class="view">
        <div class="phone-login-container">
            <div class="login-card">
                <div class="login-icon">👔✨</div>
                <div class="login-title">洗衣管家</div>
                <div class="login-desc">输入手机号，即刻开始收衣</div>
                <div class="phone-input-wrapper">
                    <input type="tel" id="phoneInput" placeholder="手机号码" maxlength="11" autocomplete="off">
                    <button class="enter-btn" id="startLaundryBtn">进入收衣</button>
                </div>
                <div id="loginError" class="error-hint"></div>
            </div>
        </div>
    </div>

    <!-- 视图2: 收衣主系统 (电话验证后出现) -->
    <div id="laundryView" class="view hidden-view">
        <div class="laundry-main">
            <!-- 用户信息栏，可显示当前电话，并提供“更换号码”返回 -->
            <div class="user-welcome">
                <div class="user-info" id="userWelcomeSpan">👤 顾客: --</div>
                <button class="switch-phone-btn" id="switchPhoneBtn">🔁 更换手机号</button>
            </div>

            <!-- 分类导航栏 -->
            <div class="categories-scroll" id="categoryNav">
                <div class="cat-chip" data-cat="上装">上装</div>
                <div class="cat-chip" data-cat="下装">下装</div>
                <div class="cat-chip" data-cat="鞋靴">鞋靴</div>
                <div class="cat-chip" data-cat="皮质服饰">皮质服饰</div>
                <div class="cat-chip" data-cat="箱包">箱包</div>
                <div class="cat-chip" data-cat="其他">其他</div>
            </div>

            <!-- 衣物动态网格 -->
            <div id="garmentsContainer" class="garments-grid"></div>

            <!-- 历史常用模块 (基于该手机号) -->
            <div class="history-section">
                <div class="history-title">📋 近期常洗 · 快速加单</div>
                <div id="historyList" class="history-list"></div>
            </div>

            <!-- 当前订单明细区 -->
            <div id="orderDetailsPanel" class="order-detail-list"></div>

            <!-- 底部购物车栏 -->
            <div class="cart-bottom-bar">
                <div class="cart-stats">
                    <span>👕 件数: <strong id="totalItems">0</strong></span>
                    <span>💰 合计: <span id="totalPriceSpan" class="cart-total">0.00</span> 元</span>
                </div>
                <button class="checkout-button" id="checkoutBtn">去结算 🧾</button>
            </div>
        </div>
    </div>
</div>

<script>
    // ----------------------------- 洗衣数据库 ---------------------------------
    const garmentsDB = {
        // 上装 (基于图片价格)
        "小香衣": { cat: "上装", price: 50 },
        "牛仔衣": { cat: "上装", price: 40 },
        "真丝衬衫": { cat: "上装", price: 40 },
        "衬衫": { cat: "上装", price: 20 },
        "真丝T恤": { cat: "上装", price: 40 },
        "T恤": { cat: "上装", price: 20 },
        "西服": { cat: "上装", price: 30 },
        "夹克": { cat: "上装", price: 30 },
        "卫衣": { cat: "上装", price: 30 },
        "短款毛衣": { cat: "上装", price: 30 },
        "中款毛衣": { cat: "上装", price: 40 },
        "长款毛衣": { cat: "上装", price: 50 },
        "吊带背心": { cat: "上装", price: 15 },
        "短款风衣": { cat: "上装", price: 40 },
        "中款风衣": { cat: "上装", price: 50 },
        "长款风衣": { cat: "上装", price: 60 },
        "短款羽绒服": { cat: "上装", price: 40 },
        "中款羽绒服": { cat: "上装", price: 50 },
        "长款羽绒服": { cat: "上装", price: 60 },
        "羽绒背心": { cat: "上装", price: 35 },
        "羊绒背心": { cat: "上装", price: 30 },
        "短款仿皮外套": { cat: "上装", price: 70 },
        "中款仿皮外套": { cat: "上装", price: 80 },
        "长款仿皮外套": { cat: "上装", price: 90 },
        "短款呢子/手料外套": { cat: "上装", price: 70 },
        "中款呢子/手料外套": { cat: "上装", price: 80 },
        "短款人造手外套": { cat: "上装", price: 70 },
        "中款人造手外套": { cat: "上装", price: 80 },
        "长款人造手外套": { cat: "上装", price: 90 },
        // 下装
        "牛仔裤": { cat: "下装", price: 30 },
        "休闲裤": { cat: "下装", price: 25 },
        "西裤": { cat: "下装", price: 28 },
        "短裙": { cat: "下装", price: 25 },
        "长裙": { cat: "下装", price: 35 },
        "运动裤": { cat: "下装", price: 25 },
        // 鞋靴
        "运动鞋": { cat: "鞋靴", price: 35 },
        "皮鞋": { cat: "鞋靴", price: 45 },
        "靴子": { cat: "鞋靴", price: 55 },
        "帆布鞋": { cat: "鞋靴", price: 30 },
        // 皮质服饰
        "皮夹克": { cat: "皮质服饰", price: 80 },
        "皮衣": { cat: "皮质服饰", price: 85 },
        "皮裤": { cat: "皮质服饰", price: 70 },
        // 箱包
        "手提包": { cat: "箱包", price: 45 },
        "双肩包": { cat: "箱包", price: 40 },
        "单肩包": { cat: "箱包", price: 42 },
        "旅行箱": { cat: "箱包", price: 70 },
        // 其他
        "围巾": { cat: "其他", price: 18 },
        "帽子": { cat: "其他", price: 15 },
        "领带": { cat: "其他", price: 12 }
    };
    
    // 当前登录顾客
    let currentPhone = null;
    // 购物车数据: [{ garmentKey, name, price, quantity }]
    let cart = [];
    // 当前选中的分类
    let activeCategory = "上装";
    
    // 历史记录存储: phone -> 衣物key数组
    let historyMap = new Map();
    
    // DOM 元素
    const phoneView = document.getElementById('phoneView');
    const laundryView = document.getElementById('laundryView');
    const phoneInput = document.getElementById('phoneInput');
    const startBtn = document.getElementById('startLaundryBtn');
    const loginError = document.getElementById('loginError');
    const switchPhoneBtn = document.getElementById('switchPhoneBtn');
    const userWelcomeSpan = document.getElementById('userWelcomeSpan');
    const garmentsContainer = document.getElementById('garmentsContainer');
    const historyListDiv = document.getElementById('historyList');
    const orderDetailsPanel = document.getElementById('orderDetailsPanel');
    const totalItemsSpan = document.getElementById('totalItems');
    const totalPriceSpan = document.getElementById('totalPriceSpan');
    const checkoutBtn = document.getElementById('checkoutBtn');
    
    // ---------- 辅助函数 ----------
    function saveCartToLocal() {
        if (currentPhone) {
            localStorage.setItem(`ucc_cart_${currentPhone}`, JSON.stringify(cart));
        }
    }
    
    function loadCartFromLocal() {
        if (currentPhone) {
            const saved = localStorage.getItem(`ucc_cart_${currentPhone}`);
            if (saved) {
                try { cart = JSON.parse(saved); } catch(e){ cart = []; }
            } else { cart = []; }
        } else { cart = []; }
        updateCartUI();
    }
    
    function updateHistoryStorage() {
        if (currentPhone) {
            const historyArr = historyMap.get(currentPhone) || [];
            localStorage.setItem(`ucc_history_${currentPhone}`, JSON.stringify(historyArr));
        }
    }
    
    function loadHistoryForPhone() {
        if (currentPhone) {
            const stored = localStorage.getItem(`ucc_history_${currentPhone}`);
            if (stored) {
                try {
                    let arr = JSON.parse(stored);
                    historyMap.set(currentPhone, arr);
                } catch(e) { historyMap.set(currentPhone, []); }
            } else {
                historyMap.set(currentPhone, []);
            }
        }
        renderHistoryChips();
    }
    
    // 添加至历史 (记录最近点击的衣物)
    function addToHistory(garmentKey) {
        if (!currentPhone) return;
        let list = historyMap.get(currentPhone) || [];
        list = list.filter(k => k !== garmentKey);
        list.unshift(garmentKey);
        if (list.length > 8) list.pop();
        historyMap.set(currentPhone, list);
        updateHistoryStorage();
        renderHistoryChips();
    }
    
    function renderHistoryChips() {
        if (!historyListDiv) return;
        const history = (currentPhone && historyMap.get(currentPhone)) ? historyMap.get(currentPhone) : [];
        if (history.length === 0) {
            historyListDiv.innerHTML = '<span style="font-size:0.7rem; color:#aaa;">暂无常用衣物，点击上方衣物后快速加单</span>';
            return;
        }
        let html = '';
        history.forEach(key => {
            const g = garmentsDB[key];
            if (g) {
                html += `<div class="history-item" data-garment="${key}">${key} ¥${g.price}</div>`;
            }
        });
        historyListDiv.innerHTML = html;
        document.querySelectorAll('.history-item').forEach(el => {
            el.addEventListener('click', (e) => {
                const gKey = el.getAttribute('data-garment');
                if (gKey && garmentsDB[gKey]) addToCart(gKey);
                e.stopPropagation();
            });
        });
    }
    
    // 购物车逻辑
    function addToCart(garmentKey) {
        const garment = garmentsDB[garmentKey];
        if (!garment) return;
        const existing = cart.find(item => item.garmentKey === garmentKey);
        if (existing) {
            existing.quantity += 1;
        } else {
            cart.push({ garmentKey, name: garmentKey, price: garment.price, quantity: 1 });
        }
        updateCartUI();
        saveCartToLocal();
        addToHistory(garmentKey);
    }
    
    function removeFromCart(garmentKey) {
        const idx = cart.findIndex(i => i.garmentKey === garmentKey);
        if (idx !== -1) {
            if (cart[idx].quantity > 1) {
                cart[idx].quantity -= 1;
            } else {
                cart.splice(idx, 1);
            }
        }
        updateCartUI();
        saveCartToLocal();
    }
    
    function updateCartUI() {
        const totalQty = cart.reduce((sum, i) => sum + i.quantity, 0);
        const totalAmount = cart.reduce((sum, i) => sum + (i.price * i.quantity), 0);
        totalItemsSpan.innerText = totalQty;
        totalPriceSpan.innerText = totalAmount.toFixed(2);
        // 渲染明细
        if (orderDetailsPanel) {
            if (cart.length === 0) {
                orderDetailsPanel.innerHTML = '<span style="color:#aaa;">📭 暂未添加衣物，点击上方服饰开始收衣</span>';
            } else {
                let detailHtml = '';
                cart.forEach(item => {
                    detailHtml += `
                        <div class="order-item-row">
                            <span>${item.name} x ${item.quantity}</span>
                            <span>¥${(item.price * item.quantity).toFixed(2)} 
                                <button class="remove-item-btn" data-g="${item.garmentKey}">−</button>
                            </span>
                        </div>
                    `;
                });
                orderDetailsPanel.innerHTML = detailHtml;
                document.querySelectorAll('.remove-item-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const gKey = btn.getAttribute('data-g');
                        if (gKey) removeFromCart(gKey);
                        e.stopPropagation();
                    });
                });
            }
        }
    }
    
    // 渲染衣物网格
    function renderGarments() {
        const filtered = Object.entries(garmentsDB).filter(([_, val]) => val.cat === activeCategory);
        if (filtered.length === 0) {
            garmentsContainer.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:40px;">暂无此类衣物</div>';
            return;
        }
        let html = '';
        filtered.forEach(([key, val]) => {
            html += `
                <div class="garment-card" data-garment="${key}">
                    <div class="garment-name">${key}</div>
                    <div class="garment-price">¥${val.price}</div>
                </div>
            `;
        });
        garmentsContainer.innerHTML = html;
        document.querySelectorAll('.garment-card').forEach(card => {
            card.addEventListener('click', (e) => {
                const gKey = card.getAttribute('data-garment');
                if (gKey) addToCart(gKey);
            });
        });
    }
    
    function bindCategoryEvents() {
        const chips = document.querySelectorAll('.cat-chip');
        chips.forEach(chip => {
            chip.addEventListener('click', () => {
                chips.forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                activeCategory = chip.getAttribute('data-cat');
                renderGarments();
            });
        });
    }
    
    // 重置并进入收衣系统 (电话验证)
    function enterLaundrySystem(phone) {
        if (!phone) return false;
        const phoneRegex = /^1[0-9]{10}$/;
        if (!phoneRegex.test(phone)) {
            loginError.innerText = '❌ 请输入11位有效手机号';
            return false;
        }
        currentPhone = phone;
        // 加载历史与购物车
        loadCartFromLocal();
        loadHistoryForPhone();
        // 更新欢迎语
        let userName = localStorage.getItem(`ucc_name_${phone}`);
        if (!userName) {
            userName = phone.slice(-4);
        }
        userWelcomeSpan.innerHTML = `👤 ${userName} (${phone}) | 会员`;
        // 切换视图
        phoneView.classList.add('hidden-view');
        laundryView.classList.remove('hidden-view');
        // 刷新衣物网格
        renderGarments();
        // 重置分类高亮
        document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
        const defaultCat = document.querySelector('.cat-chip[data-cat="上装"]');
        if (defaultCat) defaultCat.classList.add('active');
        activeCategory = "上装";
        renderGarments();
        return true;
    }
    
    // 结算功能
    function checkout() {
        if (!cart.length) {
            alert('请至少添加一件衣物再结算');
            return;
        }
        const total = cart.reduce((s,i) => s + i.price * i.quantity, 0);
        const orderId = 'UCC' + Date.now().toString().slice(-8);
        const orderRecord = {
            id: orderId,
            phone: currentPhone,
            customerName: (localStorage.getItem(`ucc_name_${currentPhone}`) || currentPhone.slice(-4)),
            items: JSON.parse(JSON.stringify(cart)),
            total: total,
            createdAt: new Date().toISOString()
        };
        // 保存至全局订单
        let allOrders = [];
        const storedOrders = localStorage.getItem('ucc_all_orders');
        if (storedOrders) try { allOrders = JSON.parse(storedOrders); } catch(e){}
        allOrders.unshift(orderRecord);
        localStorage.setItem('ucc_all_orders', JSON.stringify(allOrders));
        // 清空购物车
        cart = [];
        saveCartToLocal();
        updateCartUI();
        alert(`✅ 收衣成功！订单 ${orderId} 总金额 ¥${total.toFixed(2)}\n衣物已录入UCC系统。`);
        renderGarments(); // 刷新界面
    }
    
    // 更换手机号（返回电话界面，保留数据不清除个人档案）
    function switchPhone() {
        // 保存当前用户购物车已持久化，返回电话界面
        currentPhone = null;
        cart = [];
        phoneView.classList.remove('hidden-view');
        laundryView.classList.add('hidden-view');
        phoneInput.value = '';
        loginError.innerText = '';
    }
    
    // 事件绑定
    startBtn.addEventListener('click', () => {
        const phone = phoneInput.value.trim();
        enterLaundrySystem(phone);
    });
    phoneInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            const phone = phoneInput.value.trim();
            enterLaundrySystem(phone);
        }
    });
    switchPhoneBtn.addEventListener('click', switchPhone);
    checkoutBtn.addEventListener('click', checkout);
    
    // 可选：会员名可编辑 (双击欢迎区域)
    userWelcomeSpan.addEventListener('dblclick', () => {
        if (!currentPhone) return;
        let newName = prompt('编辑顾客昵称/姓名', localStorage.getItem(`ucc_name_${currentPhone}`) || currentPhone.slice(-4));
        if (newName && newName.trim()) {
            localStorage.setItem(`ucc_name_${currentPhone}`, newName.trim());
            userWelcomeSpan.innerHTML = `👤 ${newName.trim()} (${currentPhone}) | 会员`;
        }
    });
    
    // 初始化加载分类监听器 (动态需要确保绑定)
    setTimeout(() => {
        bindCategoryEvents();
    }, 100);
    // 默认展示电话界面
    phoneView.classList.remove('hidden-view');
    laundryView.classList.add('hidden-view');
</script>
</body>
</html>
